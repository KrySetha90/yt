<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video downloader</title>
<style>
  :root {
    --bg: #f5f6f4; --panel: #ffffff; --ink: #1c2321; --muted: #5d6965;
    --line: #d5dad7; --accent: #0f6b5c; --accent-ink: #ffffff; --err: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a19; --panel: #1e2524; --ink: #e8edeb; --muted: #9aa8a3;
      --line: #35403d; --accent: #46c2ab; --accent-ink: #0c1412; --err: #f2938c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    padding: 40px 16px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    font: inherit; font-weight: 600; cursor: pointer; padding: 12px 18px;
    border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: .5; cursor: wait; }
  button.q { background: var(--panel); color: var(--ink); border-color: var(--line); padding: 10px 16px; }
  button.q:hover:not(:disabled) { border-color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #card { display: none; margin-top: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #thumb { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--line); }
  .body { padding: 16px; }
  #title { font-size: 1.1rem; font-weight: 600; margin: 0; }
  #meta { color: var(--muted); margin: 2px 0 16px; font-size: .9rem; }
  .qs { display: flex; flex-wrap: wrap; gap: 8px; }
  #status { margin-top: 16px; min-height: 1.5em; color: var(--muted); }
  #status.err { color: var(--err); }
  .note { margin-top: 32px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Video downloader</h1>
  <p class="sub">Paste a YouTube link, pick a quality, and save the file.</p>

  <div class="row">
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" aria-label="Video link">
    <button id="go">Get video</button>
  </div>

  <section id="card" aria-live="polite">
    <img id="thumb" alt="">
    <div class="body">
      <p id="title"></p>
      <p id="meta"></p>
      <div class="qs" id="qs"></div>
    </div>
  </section>

  <div id="status" role="status"></div>

  <p class="note">
    Needs the helper running on your computer (<code>python server.py</code>).
    Only download videos you own, have permission to save, or that carry a license allowing it.
    Downloading other videos can break YouTube’s Terms of Service.
  </p>
</main>

<script>
  const API = "http://127.0.0.1:8765";
  const $ = id => document.getElementById(id);
  const urlEl = $("url"), goBtn = $("go"), card = $("card"), qs = $("qs"), statusEl = $("status");

  function setStatus(msg, isErr) {
    statusEl.textContent = msg || "";
    statusEl.className = isErr ? "err" : "";
  }

  async function api(path) {
    let res;
    try { res = await fetch(API + path); }
    catch { throw new Error("Can’t reach the helper. Run “python server.py” and try again."); }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    return data;
  }

  function fmtTime(s) {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0");
  }

  function addButton(label, height) {
    const b = document.createElement("button");
    b.className = "q"; b.textContent = label;
    b.onclick = () => download(height, b);
    qs.appendChild(b);
  }

  goBtn.onclick = async () => {
    const url = urlEl.value.trim();
    if (!url) { setStatus("Paste a video link first.", true); return; }
    goBtn.disabled = true; card.style.display = "none"; setStatus("Looking up video…");
    try {
      const d = await api("/info?url=" + encodeURIComponent(url));
      $("thumb").src = d.thumbnail || "";
      $("title").textContent = d.title || "Untitled";
      $("meta").textContent = [d.channel, fmtTime(d.duration)].filter(Boolean).join(" • ");
      qs.textContent = "";
      d.heights.forEach(h => addButton(h + "p", String(h)));
      addButton("Audio only (MP3)", "audio");
      card.style.display = "block"; setStatus("");
    } catch (e) { setStatus(e.message, true); }
    goBtn.disabled = false;
  };
  urlEl.addEventListener("keydown", e => { if (e.key === "Enter") goBtn.click(); });

  async function download(height, btn) {
    const all = qs.querySelectorAll("button"); all.forEach(b => b.disabled = true);
    setStatus("Downloading on your computer… larger files take a few minutes.");
    try {
      const f = await api("/prepare?url=" + encodeURIComponent(urlEl.value.trim()) + "&height=" + height);
      const a = document.createElement("a");
      a.href = API + "/file?id=" + f.id; a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setStatus("Done. Your browser is saving “" + f.name + "”.");
    } catch (e) { setStatus(e.message, true); }
    all.forEach(b => b.disabled = false);
  }
</script>
</body>
</html>
